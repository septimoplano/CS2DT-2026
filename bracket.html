<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/logo_BDLP.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRACKET · Batalla de los Papagallos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&display=block" rel="stylesheet">
<style>
  :root {
    --red:#e01a1a; --red-dark:#9b0f0f; --red-glow:#ff2222;
    --black:#000; --dark:#0a0a0a; --dark2:#111; --dark3:#1a1a1a;
    --white:#f0f0f0; --grey:#888; --grey-light:#ccc;
    --blue:#3b82f6; --gold:#f59e0b; --yellow:#eab308; --purple:#a78bfa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background: linear-gradient(180deg, #000 0%, #060000 70%, #0d0000 100%);
    color:var(--white); font-family:'Barlow Condensed',sans-serif; overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column; animation:pageIn .25s ease both;
  }
  #particles-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  header {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0 40px; height:64px;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(224,26,26,0.3);
  }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:4px; color:var(--white); text-decoration:none; }
  .logo span { color:var(--red); }
  nav { display:flex; align-items:center; gap:8px; justify-self:end; }
  nav a { color:var(--grey-light); text-decoration:none; font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:8px 16px; transition:color .2s; position:relative; }
  nav a::after { content:''; position:absolute; bottom:4px; left:16px; right:16px; height:1px; background:var(--red); transform:scaleX(0); transition:transform .2s; }
  nav a:hover,nav a.active { color:var(--white); }
  nav a:hover::after,nav a.active::after { transform:scaleX(1); }
  .btn-discord { display:flex; align-items:center; gap:8px; background:#5865F2; color:#fff!important; padding:8px 18px!important; border-radius:4px; font-weight:700!important; }
  .btn-discord::after { display:none!important; }
  .btn-discord:hover { background:#4752C4!important; }
  .btn-discord svg { width:16px; height:16px; }
  .header-cd { display:flex; flex-direction:column; align-items:center; gap:1px; }
  .header-cd-label { font-size:9px; letter-spacing:3px; color:var(--grey); text-transform:uppercase; }
  .header-cd-timer { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:2px; color:var(--white); display:flex; align-items:baseline; gap:4px; }
  .header-cd-timer .hct-num { color:var(--red); min-width:1.8ch; text-align:center; }
  .header-cd-timer .hct-sep { color:rgba(224,26,26,.4); font-size:18px; }

  section { position:relative; z-index:1; padding:100px 40px 80px; flex:1; display:flex; flex-direction:column; align-items:center; }
  .section-title { font-family:'Bebas Neue',sans-serif; font-size:56px; letter-spacing:6px; margin-bottom:8px; max-width:1100px; margin-left:auto; margin-right:auto; width:100%; }
  .section-title span { color:var(--white); }
  .section-divider { height:2px; background:var(--red); margin-bottom:48px; max-width:1100px; width:100%; margin-left:auto; margin-right:auto; }

  .bracket-vertical { display:flex; flex-direction:column; gap:0; max-width:1100px; margin:0 auto; width:100%; }
  .phase-header-row { display:flex; align-items:center; gap:14px; margin-bottom:16px; position:relative; width:100%; }
  .ph-badge { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; padding:4px 12px; border-radius:2px; flex-shrink:0; }
  .badge-dm    { color:var(--yellow); background:rgba(234,179,8,.1);   border:1px solid rgba(234,179,8,.2); }
  .badge-elim  { color:var(--red);    background:rgba(224,26,26,.1);   border:1px solid rgba(224,26,26,.2); }
  .badge-round { color:var(--blue);   background:rgba(59,130,246,.1);  border:1px solid rgba(59,130,246,.2); }
  .badge-semi  { color:var(--purple); background:rgba(167,139,250,.1); border:1px solid rgba(167,139,250,.2); }
  .badge-third { color:var(--grey-light); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); }
  .badge-gf    { color:var(--gold);   background:rgba(245,158,11,.1);  border:1px solid rgba(245,158,11,.2); }
  .ph-label { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:3px; color:var(--white); position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; }
  .ph-desc  { font-size:11px; letter-spacing:1.5px; color:var(--grey); margin-left:auto; }
  .phase-arrow { display:flex; flex-direction:column; align-items:center; padding:10px 0; }
  .pa-line { width:1px; height:22px; background:rgba(224,26,26,.2); }
  .pa-icon { font-size:14px; color:rgba(224,26,26,.35); line-height:1; }

  .dm-phase-card { background:var(--dark2); border:1px solid rgba(255,255,255,.06); border-radius:2px; padding:20px; }
  .dm-phase-card.dm-done   { border-left:3px solid var(--yellow); }
  .dm-phase-card.elim-done { border-left:3px solid var(--red); }
  .dm-not-set { font-size:13px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; }
  .dm-rank-list { display:flex; flex-direction:column; gap:8px; }
  .dm-rank-row { display:flex; align-items:center; gap:14px; padding:10px 14px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.04); }
  .dm-rank-pos { font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--grey); min-width:32px; text-align:right; }
  .dm-rank-pos.podio { color:var(--yellow); }
  .dm-rank-row img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.12); }
  .dm-rank-pname { flex:1; font-size:15px; font-weight:600; }
  .dm-rank-kills { font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--white); }
  .dm-rank-kills-lbl { font-size:11px; color:var(--grey); letter-spacing:1px; }
  .dm-elim-tag { font-size:9px; letter-spacing:2px; color:var(--red); background:rgba(224,26,26,.1); padding:2px 8px; border-radius:2px; text-transform:uppercase; margin-left:8px; }
  .matches-row { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .b-match { background:var(--dark2); border:1px solid rgba(255,255,255,.07); border-radius:2px; overflow:hidden; width:260px; flex-shrink:0; }
  .b-slot { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid rgba(255,255,255,.05); font-size:14px; font-weight:600; min-height:48px; }
  .b-slot:last-child { border-bottom:none; }
  .b-slot.winner   { background:rgba(59,130,246,.12); color:var(--blue); }
  .b-slot.winner-g { background:rgba(245,158,11,.12); color:var(--gold); }
  .b-slot.loser    { opacity:.45; text-decoration:line-through; }
  .b-slot.tbd      { color:var(--grey); font-style:italic; font-weight:300; font-size:13px; }
  .b-slot img { width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.15); flex-shrink:0; }
  .b-slot .sc { margin-left:auto; font-family:'Bebas Neue',sans-serif; font-size:20px; min-width:16px; text-align:right; color:var(--grey); }
  .b-slot.winner .sc   { color:var(--blue); }
  .b-slot.winner-g .sc { color:var(--gold); }
  .b-match-bo { padding:4px 12px; font-size:10px; color:var(--gold); letter-spacing:2px; border-top:1px solid rgba(255,255,255,.04); font-family:'Bebas Neue',sans-serif; text-align:center; }
  .final-row { display:flex; flex-direction:column; gap:0; }
  .final-sect { display:flex; flex-direction:column; align-items:center; }
  .champion-wrap { margin-top:32px; text-align:center; padding:40px; background:rgba(245,158,11,.05); border:1px solid rgba(245,158,11,.15); border-radius:2px; max-width:560px; }
  .champion-wrap h3 { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:5px; color:var(--gold); margin-bottom:20px; }
  .champion-wrap img { width:80px; height:80px; border-radius:50%; border:2px solid var(--gold); object-fit:cover; display:block; margin:0 auto 14px; }
  .champion-wrap .champ-name { font-family:'Bebas Neue',sans-serif; font-size:48px; letter-spacing:4px; color:var(--white); }
  .empty-state { padding:60px; text-align:center; color:var(--grey); font-size:13px; letter-spacing:2px; text-transform:uppercase; border:1px dashed rgba(255,255,255,.08); }

  footer { position:relative; z-index:1; text-align:center; padding:32px; border-top:1px solid rgba(255,255,255,.05); font-size:11px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; }
  footer span { color:var(--red); }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:var(--black); }
  ::-webkit-scrollbar-thumb { background:var(--red-dark); border-radius:2px; }
  @media(max-width:768px) {
    header { padding:0 20px; }
    section { padding:100px 20px 60px; }
    nav a:not(.btn-discord) { display:none; }

    .matches-row { gap:8px; }
    .b-match { width:100%; max-width:280px; }
  }
  @keyframes pageIn { from { opacity:0 } to { opacity:1 } }

  /* SIDE COLUMNS */
  .side-col { position:fixed; top:50%; transform:translateY(-50%); z-index:10; display:flex; flex-direction:column; gap:12px; width:200px; }
  .side-col.left  { left:28px; }
  .side-col.right { right:28px; }
  .side-player { display:flex; align-items:center; gap:10px; padding:8px 10px; background:rgba(10,10,14,.7); border:1px solid rgba(255,255,255,.06); border-radius:3px; backdrop-filter:blur(6px); transition:border-color .2s; }
  .side-player:hover { border-color:rgba(224,26,26,.3); }
  .side-player.elim img { filter:saturate(0%); opacity:.5; }
  .side-player img { width:38px; height:38px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.12); flex-shrink:0; }
  .side-player-info { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .side-player-name { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-player-status { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--grey); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-player-status.champ  { color:var(--gold); }
  .side-player-status.silver { color:#c0c0c0; }
  .side-player-status.bronze { color:#cd7f32; }
  .side-player-status.active { color:#a78bfa; }
  .side-player-status.warn   { color:#f59e0b; }
  .side-player-status.elim   { color:var(--red); }
  @media(max-width:1400px){ .side-col { display:none; } }

  /* GLITCH TITLE */
  .section-title.glitching { animation: glitch-ab 0.11s steps(1) infinite; }
  @keyframes glitch-ab {
    0%   { text-shadow: 2px 0 rgba(224,26,26,.75), -2px 0 rgba(0,220,255,.55); transform:none; }
    30%  { text-shadow: -3px 1px rgba(224,26,26,.9), 3px -1px rgba(0,220,255,.6); transform:skewX(-.5deg); }
    60%  { text-shadow: 1px -2px rgba(224,26,26,.65), -1px 2px rgba(0,220,255,.7); transform:skewX(.4deg) translateX(1px); }
    80%  { text-shadow: 3px 0 rgba(224,26,26,.8), -3px 0 rgba(0,220,255,.5); transform:skewX(-.2deg); }
    100% { text-shadow: 2px 0 rgba(224,26,26,.75), -2px 0 rgba(0,220,255,.55); transform:none; }
  }
  .section-title.glitch-settled { text-shadow: 1.5px 0 rgba(224,26,26,.5), -1.5px 0 rgba(0,220,255,.35); }
  .glitch-cursor { color:var(--red) !important; animation:blink-cur 1s step-start infinite; }
  @keyframes blink-cur { 0%, 100% { opacity:1; } 50% { opacity:0; } }
  /* ANIMATED BG ORBS */
  .bg-orbs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(88px); width:40vw; height:40vh; background:rgba(182,8,8,.3); }
  @keyframes d1 { 0%{transform:translate(0,0)}   100%{transform:translate(65px,-100px)} }
  @keyframes d2 { 0%{transform:translate(0,0)}   100%{transform:translate(-75px,-85px)} }
  @keyframes d3 { 0%{transform:translate(0,0)}   100%{transform:translate(85px,65px)}   }
  @keyframes d4 { 0%{transform:translate(0,0)}   100%{transform:translate(-55px,75px)}  }
  @keyframes d5 { 0%{transform:translate(0,0)}   100%{transform:translate(45px,-115px)} }  .o1{left:5%;   top:3%;  animation:d1 18s ease-in-out infinite alternate;}
  .o2{left:62%;  top:7%;  animation:d2 23s ease-in-out infinite alternate;}
  .o3{left:-8%;  top:42%; animation:d5 27s ease-in-out infinite alternate;}
  .o4{left:64%;  top:40%; animation:d3 20s ease-in-out infinite alternate;}
  .o5{left:32%;  top:68%; animation:d4 16s ease-in-out infinite alternate;}

    100% { transform:translate(-100px,-170px); }
  }
</style>
</head>

  <nav>

    <a href="https://discord.gg/aH4NMNwQve" target="_blank" class="btn-discord">

<script>
const PLAYERS = {
  "76561199550607862":{"name":"FULLRECORDS","avatar":"https://avatars.steamstatic.com/970695a0720b604e3448204cb2811091bdab699e_medium.jpg"},
  "76561199679639257":{"name":"Dom","avatar":"https://avatars.steamstatic.com/0abb44703585b0e6c43ad53886e04fd294208daf_medium.jpg"},
  "76561199148697791":{"name":"Matador Salas","avatar":"https://avatars.steamstatic.com/43b5674a82decb2ebb32c860a99f4d505ae3ce57_medium.jpg"},
  "76561198281472932":{"name":"Baltica14","avatar":"https://avatars.steamstatic.com/3ae572cafefbf47023c385a1213466e8e83c7072_medium.jpg"},
  "76561199841015593":{"name":"Pablito Marmol","avatar":"https://avatars.steamstatic.com/3416524307f21b0f0b0666e87d7b730beba5ed60_medium.jpg"},
  "76561198064411344":{"name":"Wayoman","avatar":"https://avatars.steamstatic.com/f67afcb84d6c01125d4cbe35a3491d201ecf4a9c_medium.jpg"},
  "76561198220829112":{"name":"ZachXBT","avatar":"https://avatars.steamstatic.com/715f0fbeb04d9217e47c9445e9734a729a7c9070_medium.jpg"},
  "76561198147808566":{"name":"Toallín","avatar":"https://avatars.steamstatic.com/2c0b15cbdceefc2070500651d03ff68d47a56ce0_medium.jpg"},
  "76561199052181492":{"name":"mateo186GB","avatar":"https://avatars.steamstatic.com/025d05d0c15afceb85db5965c763bdd7ca862611_medium.jpg"},
  "76561198009515551":{"name":"Gusano0","avatar":"https://avatars.steamstatic.com/3a6df1fe8908553e55a9080c0d9bd986873d49bc_medium.jpg"}
};

function pl(id){ return id && PLAYERS[id] ? PLAYERS[id] : null; }

const ALL_IDS = [
  "76561199148697791", // Matador Salas
  "76561199841015593", // Pablito Marmol
  "76561198009515551", // Gusano0
  "76561198220829112", // ZachXBT
  "76561198064411344", // Wayoman
  "76561198281472932", // Baltica14
  "76561199550607862", // FULLRECORDS (Gabo)
  "76561199679639257", // Dom
  "76561199052181492", // mateo186GB
  "76561198147808566", // Toallín
];

function getPlayerPhase(id, state){
  if (state.gran_final?.finished){
    if (state.gran_final.winner===id) return {label:'Papagallo Máximo',cls:'champ'};
    if (state.gran_final.player_a===id||state.gran_final.player_b===id) return {label:'2do Lugar',cls:'silver'};
  }
  if (state.tercer_lugar?.finished&&state.tercer_lugar?.winner===id) return {label:'3er Lugar',cls:'bronze'};
  if (state.gran_final?.player_a===id||state.gran_final?.player_b===id) return {label:'Disputando título',cls:'active'};
  if (state.tercer_lugar?.player_a===id||state.tercer_lugar?.player_b===id) return {label:'Disputando 3er lugar',cls:'active'};
  if ((state.semifinales?.matches||[]).some(m=>m.player_a===id||m.player_b===id)) return {label:'Semifinal',cls:'active'};
  if ((state.dm_elim?.entries||[]).some(e=>e.playerId===id)){
    const isOut=state.dm_elim?.finished&&!(state.semifinales?.matches||[]).some(m=>m.player_a===id||m.player_b===id);
    return isOut?{label:'Eliminado',cls:'elim'}:{label:'DM Eliminación',cls:'warn'};
  }
  if ((state.fase1?.matches||[]).some(m=>m.player_a===id||m.player_b===id)){
    const lostFase1=(state.fase1?.matches||[]).some(m=>m.finished&&m.winner&&m.winner!==id&&(m.player_a===id||m.player_b===id));
    if(lostFase1) return {label:'Eliminado',cls:'elim'};
    return {label:'Fase 1',cls:'active'};
  }
  const dmHasResults=(state.dm_inicial?.entries||[]).some(e=>e.kills!==null);
  if (dmHasResults&&(state.dm_inicial?.entries||[]).some(e=>e.playerId===id)) return {label:'DM Inicial',cls:'active'};
  return {label:'Esperando clasificación',cls:''};
}

function renderSideCols(state){
  const left=document.getElementById('side-left');
  const right=document.getElementById('side-right');
  [left,right].forEach(el=>el.innerHTML='');
  ALL_IDS.forEach((id,i)=>{
    const p=PLAYERS[id]; if(!p) return;
    const phase=getPlayerPhase(id,state);
    const div=document.createElement('div');
    div.className=`side-player${phase.cls==='elim'?' elim':''}`;
    div.innerHTML=`<img src="${p.avatar}" onerror="this.style.background='#333'">
      <div class="side-player-info">
        <span class="side-player-name">${p.name}</span>
        <span class="side-player-status ${phase.cls}">${phase.label}</span>
      </div>`;
    (i<5?left:right).appendChild(div);
  });
}

async function loadData(){
  try{ const r=await fetch('/api/state'); if(!r.ok) throw 0; return await r.json(); }
  catch{
    try{ const s=localStorage.getItem('papagallos-v3'); if(s) return JSON.parse(s); } catch{}
    return null;
  }
}

function startCountdown(target){
  function tick(){
    const diff=new Date(target)-new Date();
    const zero=diff<=0;
    const d=zero?0:Math.floor(diff/86400000), h=zero?0:Math.floor((diff%86400000)/3600000),
          m=zero?0:Math.floor((diff%3600000)/60000), s=zero?0:Math.floor((diff%60000)/1000);
    const fmt=n=>String(n).padStart(2,'0');
    document.getElementById('hcd-d').textContent=fmt(d); document.getElementById('hcd-h').textContent=fmt(h);
    document.getElementById('hcd-m').textContent=fmt(m); document.getElementById('hcd-s').textContent=fmt(s);
  }
  tick(); setInterval(tick,1000);
}

function initHeaderCountdown(data){
  const all=[]; const now=new Date();
  function collect(matches,round){ (matches||[]).forEach(m=>{ if(m&&m.date) all.push({...m,round}); }); }
  collect(data.fase1?.matches,'Fase 1'); collect(data.semifinales?.matches,'Semifinal');
  if(data.tercer_lugar?.date) all.push({...data.tercer_lugar,round:'3er Lugar'});
  if(data.gran_final?.date)   all.push({...data.gran_final,round:'Gran Final'});
  if(data.dm_inicial?.date)   all.push({...data.dm_inicial, round:'DM Inicial',isDM:true});
  if(data.dm_elim?.date)      all.push({...data.dm_elim,    round:'DM Eliminación',isDM:true});
  all.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const next=all.find(m=>new Date(m.date)>now&&!m.finished);
  if(!next) return;
  startCountdown(next.date);
  if(next.isDM){
    document.getElementById('hcd-label').textContent=next.round.toUpperCase();
  } else {
    const pa=pl(next.player_a), pb=pl(next.player_b);
    document.getElementById('hcd-label').textContent=`${pa?pa.name:'TBD'} vs ${pb?pb.name:'TBD'}`;
  }
}

// ── BRACKET RENDERING ──
function renderBracket(data){
  const c=document.getElementById('bracket-container');
  if(!data){ c.innerHTML='<div class="empty-state">El bracket se configura desde el admin</div>'; return; }
  c.innerHTML='';
  appendPhaseHeader(c,'badge-dm','DM','DEATHMATCH INICIAL','10 jugadores · Define el seeding');
  appendDMBlock(c,data.dm_inicial,false);
  appendArrow(c);
  appendPhaseHeader(c,'badge-round','FASE 1','1V1 · PRIMERA FASE','5 combates · Bo3 · 5 avanzan');
  appendMatchesRow(c,data.fase1?.matches||[],false);
  appendArrow(c);
  appendPhaseHeader(c,'badge-elim','ELIM','DEATHMATCH ELIMINACIÓN','5 jugadores · Último eliminado');
  appendDMBlock(c,data.dm_elim,true);
  appendArrow(c);
  appendPhaseHeader(c,'badge-semi','SF','SEMIFINALES','2 combates · Bo3');
  appendMatchesRow(c,data.semifinales?.matches||[],false);
  const finalRow=document.createElement('div'); finalRow.className='final-row';
  const tercerSect=document.createElement('div'); tercerSect.className='final-sect';
  appendArrow(tercerSect);
  appendPhaseHeader(tercerSect,'badge-third','3°','TERCER LUGAR','Best of 3');
  if(data.tercer_lugar) appendMatchCard(tercerSect,data.tercer_lugar,false);
  finalRow.appendChild(tercerSect);
  const gfSect=document.createElement('div'); gfSect.className='final-sect';
  appendArrow(gfSect);
  appendPhaseHeader(gfSect,'badge-gf','GF','GRAN FINAL','Best of 5');
  if(data.gran_final) appendMatchCard(gfSect,data.gran_final,true);
  finalRow.appendChild(gfSect);
  c.appendChild(finalRow);
  if(data.gran_final?.finished&&data.gran_final?.winner){
    const champ=pl(data.gran_final.winner);
    const wrap=document.createElement('div'); wrap.className='champion-wrap';
    wrap.innerHTML=`<h3>🦜 EL PAPAGALLO MÁXIMO</h3>${champ?`<img src="${champ.avatar}" alt="">`:''}
      <div class="champ-name">${champ?champ.name:'—'}</div>`;
    c.appendChild(wrap);
  }
}

function appendPhaseHeader(parent,badgeClass,badgeText,label,desc){
  const row=document.createElement('div'); row.className='phase-header-row';
  row.innerHTML=`<span class="ph-badge ${badgeClass}">${badgeText}</span><span class="ph-label">${label}</span>${desc?`<span class="ph-desc">${desc}</span>`:''}`;
  parent.appendChild(row);
}
function appendArrow(parent){
  const a=document.createElement('div'); a.className='phase-arrow';
  a.innerHTML='<div class="pa-line"></div><div class="pa-icon">▼</div>'; parent.appendChild(a);
}
function appendDMBlock(parent,dm,isElim){
  const card=document.createElement('div');
  card.className=`dm-phase-card ${dm?.finished?(isElim?'elim-done':'dm-done'):''}`;
  if(!dm||!dm.entries||!dm.entries.some(e=>e.kills!==null)){ card.innerHTML='<div class="dm-not-set">Pendiente</div>'; parent.appendChild(card); return; }
  const withK=dm.entries.filter(e=>e.kills!==null).sort((a,b)=>b.kills-a.kills);
  const list=document.createElement('div'); list.className='dm-rank-list';
  withK.forEach((e,i)=>{
    const p=pl(e.playerId); if(!p) return;
    const isLast=isElim&&dm.finished&&i===withK.length-1;
    const row=document.createElement('div'); row.className='dm-rank-row';
    row.style.cssText=isLast?'border-left:2px solid var(--red);background:rgba(224,26,26,.04)':'';
    row.innerHTML=`<span class="dm-rank-pos ${i<3?'podio':''}">#${i+1}</span>
      <img src="${p.avatar}" alt="" onerror="this.style.background='#333'">
      <span class="dm-rank-pname">${p.name}${isLast?'<span class="dm-elim-tag">ELIMINADO</span>':''}</span>
      <span class="dm-rank-kills">${e.kills}</span><span class="dm-rank-kills-lbl">kills</span>`;
    list.appendChild(row);
  });
  card.appendChild(list); parent.appendChild(card);
}
function appendMatchesRow(parent,matches,isGF){
  const row=document.createElement('div'); row.className='matches-row';
  if(!matches.length){ row.innerHTML='<div style="font-size:11px;letter-spacing:2px;color:var(--grey);text-transform:uppercase;">Pendiente</div>'; }
  else { matches.forEach(m=>appendMatchCard(row,m,isGF)); }
  parent.appendChild(row);
}
function appendMatchCard(parent,m,isGF){
  if(!m) return;
  const played=m.score_a!==null&&m.score_b!==null&&m.finished;
  const wA=played&&m.winner===m.player_a, wB=played&&m.winner===m.player_b;
  const pa=pl(m.player_a), pb=pl(m.player_b);
  function slotEl(p,id,score,isW,isL){
    const cls=isGF&&isW?'winner-g':isW?'winner':isL?'loser':!id?'tbd':'';
    return `<div class="b-slot ${cls}">${p?`<img src="${p.avatar}" onerror="this.style.background='#333'">`:''}
      <span>${p?p.name:'Por definir'}</span><span class="sc">${score!==null&&score!==undefined?score:''}</span></div>`;
  }
  const card=document.createElement('div'); card.className='b-match';
  card.innerHTML=slotEl(pa,m.player_a,m.score_a,wA,played&&!wA&&m.player_a)+slotEl(pb,m.player_b,m.score_b,wB,played&&!wB&&m.player_b);
  const boEl=document.createElement('div'); boEl.className='b-match-bo'; boEl.textContent=isGF?'BEST OF 5':'BEST OF 3'; card.appendChild(boEl);
  parent.appendChild(card);
}

// ── PARTICLES + EMBERS + LIGHTNING ──
function initParticles(){
  const canvas=document.getElementById('particles-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,pts; const embers=[],bolts=[];
  const EMBER_COLORS=['rgba(224,26,26,','rgba(255,70,10,','rgba(245,120,0,','rgba(255,160,20,'];
  let frame=0,nextBolt=120;
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
  function make(){ pts=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.3,a:Math.random()*.5+.1,red:Math.random()<.25})); }
  function spawnEmber(){ const col=EMBER_COLORS[Math.floor(Math.random()*EMBER_COLORS.length)]; embers.push({x:Math.random()*W,y:H+4,vx:(Math.random()-.5)*.8,vy:-(Math.random()*2.2+.6),r:Math.random()*1.8+.4,life:1,decay:Math.random()*.005+.003,col,flicker:Math.random()*Math.PI*2}); }
  function jag(x1,y1,x2,y2,rough,depth){ if(depth===0) return [{x:x1,y:y1},{x:x2,y:y2}]; const mx=(x1+x2)/2+(Math.random()-.5)*rough,my=(y1+y2)/2+(Math.random()-.5)*rough*.15; return [...jag(x1,y1,mx,my,rough/2,depth-1).slice(0,-1),...jag(mx,my,x2,y2,rough/2,depth-1)]; }
  function spawnBolt(){ const x=Math.random()*W,depth=H*(0.45+Math.random()*.5),pts2=jag(x,-10,x+(Math.random()-.5)*180,depth,160,8),branches=[]; for(let i=4;i<pts2.length-4;i+=Math.floor(Math.random()*6+3)){ if(Math.random()<.4){ const bLen=25+Math.random()*90,ang=(Math.random()-.5)*1.4,brPts=jag(pts2[i].x,pts2[i].y,pts2[i].x+Math.sin(ang)*bLen,pts2[i].y+Math.cos(ang)*bLen,50,5); branches.push({pts:brPts,start:i/pts2.length}); } } bolts.push({pts:pts2,branches,progress:0,speed:0.07+Math.random()*.05,phase:'travel',life:1,decay:Math.random()*.07+.055}); }
  function drawBolt(points,alpha,lw){ if(!points||points.length<2) return; ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y); for(const p of points) ctx.lineTo(p.x,p.y); ctx.strokeStyle=`rgba(200,0,0,${alpha*.22})`; ctx.lineWidth=lw*5; ctx.stroke(); ctx.strokeStyle=`rgba(230,30,30,${alpha*.5})`; ctx.lineWidth=lw*2; ctx.stroke(); ctx.strokeStyle=`rgba(255,160,160,${alpha*.95})`; ctx.lineWidth=lw*.6; ctx.stroke(); }
  function draw(){
    ctx.clearRect(0,0,W,H); frame++;
    pts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.red?`rgba(224,26,26,${p.a})`:`rgba(200,200,200,${p.a*.4})`; ctx.fill(); });
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){ const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy); if(dist<120){ const a=(1-dist/120)*.15; ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.strokeStyle=(pts[i].red||pts[j].red)?`rgba(224,26,26,${a})`:`rgba(255,255,255,${a*.4})`; ctx.lineWidth=.5; ctx.stroke(); } }
    if(Math.random()<.45) spawnEmber();
    for(let i=embers.length-1;i>=0;i--){ const e=embers[i]; e.flicker+=.09; e.x+=e.vx+Math.sin(e.flicker)*.18; e.y+=e.vy; e.vy*=.997; e.life-=e.decay; if(e.life<=0){embers.splice(i,1);continue;} const pulse=.7+Math.abs(Math.sin(e.flicker))*.3; ctx.beginPath(); ctx.arc(e.x,e.y,e.r*pulse,0,Math.PI*2); ctx.fillStyle=e.col+e.life+')'; ctx.fill(); const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*5); g.addColorStop(0,e.col+(e.life*.45)+')'); g.addColorStop(1,e.col+'0)'); ctx.beginPath(); ctx.arc(e.x,e.y,e.r*5,0,Math.PI*2); ctx.fillStyle=g; ctx.fill(); }
    if(frame>=nextBolt){ spawnBolt(); if(Math.random()<.35) setTimeout(spawnBolt,80+Math.random()*120); if(Math.random()<.15) setTimeout(spawnBolt,220+Math.random()*180); nextBolt=frame+Math.floor(Math.random()*480+360); }
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(let i=bolts.length-1;i>=0;i--){ const b=bolts[i]; if(b.phase==='travel'){ b.progress+=b.speed; if(b.progress>=1){b.progress=1;b.phase='fade';} const end=Math.max(2,Math.floor(b.pts.length*b.progress)); drawBolt(b.pts.slice(0,end),1,2); for(const br of b.branches){ if(b.progress>br.start){ const brProg=Math.min(1,(b.progress-br.start)/(1-br.start)); drawBolt(br.pts.slice(0,Math.max(2,Math.floor(br.pts.length*brProg))),.7,.9); } } } else { b.life-=b.decay; if(b.life<=0){bolts.splice(i,1);continue;} if(b.life>0.88){ctx.fillStyle=`rgba(180,0,0,${(b.life-.88)*0.07})`;ctx.fillRect(0,0,W,H);} drawBolt(b.pts,b.life,2); for(const br of b.branches) drawBolt(br.pts,b.life*.6,.9); } }
    ctx.lineCap='butt'; ctx.lineJoin='miter';
    requestAnimationFrame(draw);
  }
  resize(); make(); draw();
  window.addEventListener('resize',()=>{resize();make();});
}

document.getElementById('fy').textContent=new Date().getFullYear();
function glitchReveal(el, finalText) {
  const gc = '!<>-_\\/[]{}=+*^?#@$%▓░█▌▐0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const len = finalText.length;
  const lockAt = Array.from({length:len}, (_,i) => Math.floor(i*7)+3+Math.floor(Math.random()*5));
  let frame = 0;
  const maxFrame = Math.max(...lockAt) + 3;
  el.classList.add('glitching');
  const id = setInterval(()=>{
    el.textContent = finalText.split('').map((char,i)=>{
      if(char===' ') return ' ';
      if(frame>=lockAt[i]) return char;
      return gc[Math.floor(Math.random()*gc.length)];
    }).join('');
    frame++;
    if(frame>=maxFrame){
      clearInterval(id);
      el.textContent=finalText;
      el.classList.remove('glitching');
      el.classList.add('glitch-settled');
      const cur=document.createElement('span');
      cur.className='glitch-cursor'; cur.textContent='_';
      el.appendChild(cur);
    }
  }, 38);
}

async function init(){
  initParticles();
  const titleEl = document.getElementById('page-title');
  if(titleEl) glitchReveal(titleEl, 'BRACKET');
  const data=await loadData();
  if(data){ renderBracket(data); initHeaderCountdown(data); renderSideCols(data); }
}
init();
</script>
