<style>
  :root {
    --red:#e01a1a; --red-dark:#9b0f0f; --red-glow:#ff2222;
    --black:#000; --dark:#0a0a0a; --dark2:#111; --dark3:#1a1a1a;
    --white:#f0f0f0; --grey:#888; --grey-light:#ccc;
    --blue:#3b82f6; --gold:#f59e0b; --border:rgba(255,255,255,.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background: linear-gradient(180deg, #000 0%, #060000 70%, #0d0000 100%);
    color:var(--white); font-family:'Barlow Condensed',sans-serif; overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column; animation:pageIn .25s ease both;
  }
  #particles-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

  header {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0 40px; height:64px;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(224,26,26,0.3);
  }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:4px; color:var(--white); text-decoration:none; }
  .logo span { color:var(--red); }
  nav { display:flex; align-items:center; gap:8px; justify-self:end; }
  nav a { color:var(--grey-light); text-decoration:none; font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:8px 16px; transition:color .2s; position:relative; }
  nav a::after { content:''; position:absolute; bottom:4px; left:16px; right:16px; height:1px; background:var(--red); transform:scaleX(0); transition:transform .2s; }
  nav a:hover,nav a.active { color:var(--white); }
  nav a:hover::after,nav a.active::after { transform:scaleX(1); }
  .btn-discord { display:flex; align-items:center; gap:8px; background:#5865F2; color:#fff!important; padding:8px 18px!important; border-radius:4px; font-weight:700!important; }
  .btn-discord::after { display:none!important; }
  .btn-discord:hover { background:#4752C4!important; }
  .btn-discord svg { width:16px; height:16px; }
  .header-cd { display:flex; flex-direction:column; align-items:center; gap:1px; }
  .header-cd-label { font-size:9px; letter-spacing:3px; color:var(--grey); text-transform:uppercase; }
  .header-cd-timer { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:2px; color:var(--white); display:flex; align-items:baseline; gap:4px; }
  .header-cd-timer .hct-num { color:var(--red); min-width:1.8ch; text-align:center; }
  .header-cd-timer .hct-sep { color:rgba(224,26,26,.4); font-size:18px; }

  section { position:relative; z-index:1; padding:100px 40px 80px; flex:1; display:flex; flex-direction:column; align-items:center; }
  .section-title { font-family:'Bebas Neue',sans-serif; font-size:56px; letter-spacing:6px; margin-bottom:8px; max-width:1100px; width:100%; }
  .section-title span { color:var(--white); }
  .section-divider { height:2px; background:var(--red); margin-bottom:40px; max-width:1100px; width:100%; }

  /* ── CALENDAR ── */
  #calendar-grid { width:100%; max-width:1100px; }

  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .cal-nav-btn { background:none; border:1px solid var(--border); color:var(--grey-light); font-size:22px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:2px; transition:all .15s; }
  .cal-nav-btn:hover { border-color:var(--red); color:var(--white); }
  .cal-month-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:4px; color:var(--white); }

  .cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px; }
  .cal-wd { text-align:center; font-size:10px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; padding:6px 0; }

  .cal-days { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-day {
    aspect-ratio:1/1; background:var(--dark2); border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:8px 6px 6px; position:relative; transition:border-color .15s, background .15s;
  }
  .cal-day.other-month { opacity:.22; background:transparent; }
  .cal-day.today { border-color:rgba(224,26,26,.5); }
  .cal-day.today .cal-day-num { color:var(--red); }
  .cal-day.has-event { background:rgba(224,26,26,.07); border-color:rgba(224,26,26,.35); cursor:pointer; }
  .cal-day.has-event:hover { background:rgba(224,26,26,.14); border-color:var(--red); }
  .cal-day-num { font-family:'Bebas Neue',sans-serif; font-size:17px; color:var(--grey-light); line-height:1; }
  .cal-day.has-event .cal-day-num { color:var(--white); }
  .cal-preview { display:flex; flex-direction:column; align-items:center; gap:5px; margin-top:6px; flex:1; justify-content:center; width:100%; }
  .cal-preview-match { display:flex; align-items:center; gap:4px; justify-content:center; }
  .cal-avatar { width:26px; height:26px; border-radius:50%; object-fit:cover; border:1px solid rgba(224,26,26,.5); flex-shrink:0; }
  .cal-avatar-ph { width:26px; height:26px; border-radius:50%; background:var(--dark3); flex-shrink:0; }
  .cal-vs { font-family:'Bebas Neue',sans-serif; font-size:14px; color:var(--red); line-height:1; }
  .cal-preview-dm { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; color:var(--red); text-align:center; line-height:1.2; }
  .cal-time { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px; color:var(--grey-light); line-height:1; }
  .cal-dots { display:flex; gap:3px; padding-bottom:2px; flex-wrap:wrap; justify-content:center; }
  .cal-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .match-dot { background:var(--red); box-shadow:0 0 4px rgba(224,26,26,.6); }
  .dm-dot { background:var(--gold); box-shadow:0 0 4px rgba(245,158,11,.6); }

  /* ── NEXT EVENT BLOCK ── */
  .fechas-top { display:flex; align-items:flex-start; gap:16px; max-width:1100px; width:100%; }
  .fechas-top .section-title { flex:1; max-width:none; width:auto; }
  .next-event { flex:1; min-width:0; background:rgba(224,26,26,.06); border:1px solid rgba(224,26,26,.25); border-left:3px solid var(--red); border-radius:3px; padding:10px 24px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .next-event-top-row { display:flex; align-items:center; gap:12px; }
  .next-event-label { font-size:9px; letter-spacing:3px; color:var(--red); text-transform:uppercase; line-height:1.2; }
  .next-event-round { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:var(--white); line-height:1.1; }
  .next-event-meta { font-size:10px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; }
  .next-event-players { display:flex; align-items:center; gap:8px; flex:1; justify-content:flex-end; flex-wrap:nowrap; }
  .next-event-player { display:flex; align-items:center; gap:6px; min-width:0; }
  .next-event-player img { width:24px; height:24px; border-radius:50%; object-fit:cover; border:1px solid rgba(224,26,26,.5); flex-shrink:0; }
  .next-event-player span { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; }
  .next-event-vs { font-family:'Bebas Neue',sans-serif; font-size:16px; color:var(--red); text-shadow:0 0 8px rgba(224,26,26,.5); flex-shrink:0; }
  .next-event-dm-vs { font-family:'Bebas Neue',sans-serif; font-size:16px; color:var(--red); text-shadow:0 0 8px rgba(224,26,26,.5); }

  .empty-state { padding:60px; text-align:center; color:var(--grey); font-size:13px; letter-spacing:2px; text-transform:uppercase; border:1px dashed rgba(255,255,255,.08); }

  /* ── POPUP ── */
  .cal-popup-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(5px);
    z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .cal-popup-card {
    position:relative; background:var(--dark2); border:1px solid rgba(224,26,26,.35);
    border-top:2px solid var(--red); border-radius:3px; padding:32px 36px 28px;
    min-width:300px; max-width:400px; width:100%; max-height:85vh; overflow-y:auto;
    box-shadow:0 24px 64px rgba(0,0,0,.8);
    display:flex; flex-direction:column; gap:20px;
  }
  .cal-popup-close {
    position:absolute; top:10px; right:14px; background:none; border:none;
    color:var(--grey); cursor:pointer; font-size:24px; line-height:1; transition:color .15s;
  }
  .cal-popup-close:hover { color:var(--white); }
  .cal-popup-event { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cal-popup-event + .cal-popup-event { padding-top:20px; border-top:1px solid var(--border); }
  .cal-popup-round {
    font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:4px;
    color:var(--red); text-align:center;
  }
  .cal-popup-players { display:flex; align-items:center; gap:16px; width:100%; justify-content:center; }
  .cal-popup-player { display:flex; flex-direction:column; align-items:center; gap:7px; flex:1; min-width:0; }
  .cal-popup-player img { width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid rgba(224,26,26,.4); }
  .cal-popup-avatar-ph { width:50px; height:50px; border-radius:50%; background:var(--dark3); border:2px solid var(--border); flex-shrink:0; }
  .cal-popup-player span { font-size:13px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; }
  .cal-popup-vs { font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--red); text-shadow:0 0 14px rgba(224,26,26,.6); flex-shrink:0; }
  .cal-popup-vs-dm { font-family:'Bebas Neue',sans-serif; font-size:64px; color:var(--red); text-shadow:0 0 28px rgba(224,26,26,.7); line-height:1; }
  .cal-popup-time { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:4px; color:var(--white); }
  .cal-popup-date { font-size:10px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; }
  .cal-popup-result { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:var(--red); }
  .cal-popup-finished { font-size:9px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; }

  footer { position:relative; z-index:1; text-align:center; padding:32px; border-top:1px solid rgba(255,255,255,.05); font-size:11px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; }
  footer span { color:var(--red); }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:var(--black); }
  ::-webkit-scrollbar-thumb { background:var(--red-dark); border-radius:2px; }
  @media(max-width:768px) {
    header { padding:0 20px; }
    section { padding:100px 16px 60px; }
    nav a:not(.btn-discord) { display:none; }
    .cal-day { padding:5px 3px 4px; }
    .cal-day-num { font-size:13px; }
    .cal-popup-card { padding:24px 20px 20px; }
  }
  @keyframes pageIn { from{opacity:0} to{opacity:1} }

  /* GLITCH TITLE */
  .section-title.glitching { animation:glitch-ab .11s steps(1) infinite; }
  @keyframes glitch-ab {
    0%   { text-shadow:2px 0 rgba(224,26,26,.75),-2px 0 rgba(0,220,255,.55); transform:none; }
    30%  { text-shadow:-3px 1px rgba(224,26,26,.9),3px -1px rgba(0,220,255,.6); transform:skewX(-.5deg); }
    60%  { text-shadow:1px -2px rgba(224,26,26,.65),-1px 2px rgba(0,220,255,.7); transform:skewX(.4deg) translateX(1px); }
    80%  { text-shadow:3px 0 rgba(224,26,26,.8),-3px 0 rgba(0,220,255,.5); transform:skewX(-.2deg); }
    100% { text-shadow:2px 0 rgba(224,26,26,.75),-2px 0 rgba(0,220,255,.55); transform:none; }
  }
  .section-title.glitch-settled { text-shadow:1.5px 0 rgba(224,26,26,.5),-1.5px 0 rgba(0,220,255,.35); }
  .glitch-cursor { color:var(--red)!important; animation:blink-cur 1s step-start infinite; }
  @keyframes blink-cur { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ANIMATED BG ORBS */
  .bg-orbs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(88px); width:40vw; height:40vh; background:rgba(182,8,8,.3); }
  @keyframes d1 { 0%{transform:translate(0,0)} 100%{transform:translate(65px,-100px)} }
  @keyframes d2 { 0%{transform:translate(0,0)} 100%{transform:translate(-75px,-85px)} }
  @keyframes d3 { 0%{transform:translate(0,0)} 100%{transform:translate(85px,65px)}   }
  @keyframes d4 { 0%{transform:translate(0,0)} 100%{transform:translate(-55px,75px)}  }
  @keyframes d5 { 0%{transform:translate(0,0)} 100%{transform:translate(45px,-115px)} }
  .o1{left:28%;  top:-5%; animation:d2 21s ease-in-out infinite alternate;}
  .o2{left:70%;  top:22%; animation:d1 17s ease-in-out infinite alternate;}
  .o3{left:1%;   top:30%; animation:d3 26s ease-in-out infinite alternate;}
  .o4{left:6%;   top:64%; animation:d5 19s ease-in-out infinite alternate;}
  .o5{left:60%;  top:60%; animation:d4 24s ease-in-out infinite alternate;}
</style>

<script>

  "76561198220829112":{"name":"ZachXBT","avatar":"https://avatars.steamstatic.com/715f0fbeb04d9217e47c9445e9734a729a7c9070_medium.jpg"},

};
function pl(id){ return id && PLAYERS[id] ? PLAYERS[id] : null; }

async function loadData(){
  let cached=null;
  try{ const s=localStorage.getItem('papagallos-v3'); if(s) cached=JSON.parse(s); }catch{}
  if(cached){
    fetch('/api/state').then(r=>r.ok?r.json():null).then(d=>{
      if(d&&Object.keys(d).length) localStorage.setItem('papagallos-v3',JSON.stringify(d));
    }).catch(()=>{});
    return cached;
  }
  try{ const r=await fetch('/api/state'); if(r.ok){ const d=await r.json(); localStorage.setItem('papagallos-v3',JSON.stringify(d)); return d; }}catch{}
  return null;
}

function startCountdown(target){
  function tick(){
    const diff=new Date(target)-new Date(); const zero=diff<=0;
    const d=zero?0:Math.floor(diff/86400000), h=zero?0:Math.floor((diff%86400000)/3600000),
          m=zero?0:Math.floor((diff%3600000)/60000), s=zero?0:Math.floor((diff%60000)/1000);
    const fmt=n=>String(n).padStart(2,'0');
    document.getElementById('hcd-d').textContent=fmt(d); document.getElementById('hcd-h').textContent=fmt(h);
    document.getElementById('hcd-m').textContent=fmt(m); document.getElementById('hcd-s').textContent=fmt(s);
  }
  tick(); setInterval(tick,1000);
}

// ── CALENDAR STATE ──
let calState = { year:new Date().getFullYear(), month:new Date().getMonth(), data:null };
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function collectEvents(data){
  const ev=[];
  (data.fase1?.matches||[]).forEach(m=>{ if(m?.date) ev.push({...m,round:'Fase 1',type:'match'}); });
  (data.semifinales?.matches||[]).forEach(m=>{ if(m?.date) ev.push({...m,round:'Semifinal',type:'match'}); });
  if(data.tercer_lugar?.date) ev.push({...data.tercer_lugar,round:'3er Lugar',type:'match'});
  if(data.gran_final?.date)   ev.push({...data.gran_final,round:'Gran Final',type:'match'});
  if(data.dm_inicial?.date)   ev.push({...data.dm_inicial,round:'DM Inicial',type:'dm'});
  if(data.dm_elim?.date)      ev.push({...data.dm_elim,round:'DM Eliminación',type:'dm'});
  return ev;
}

function prevMonth(){ let {year,month,data}=calState; month--; if(month<0){month=11;year--;} renderCalendar(data,year,month); }
function nextMonth(){ let {year,month,data}=calState; month++; if(month>11){month=0;year++;} renderCalendar(data,year,month); }

function renderCalendar(data, year, month){
  if(!data) return;
  calState = {year, month, data};
  const events = collectEvents(data);
  const now = new Date();

  // Find next event for header countdown + block
  const upcoming = [...events].sort((a,b)=>new Date(a.date)-new Date(b.date))
    .find(e=>new Date(e.date)>now&&!e.finished);
  if(upcoming){
    startCountdown(upcoming.date);
    if(upcoming.type==='dm'){
      document.getElementById('hcd-label').textContent=upcoming.round.toUpperCase();
    } else {
      const pa=pl(upcoming.player_a),pb=pl(upcoming.player_b);
      document.getElementById('hcd-label').textContent=`${pa?pa.name:'TBD'} vs ${pb?pb.name:'TBD'}`;
    }
  }
  renderNextEvent(upcoming);

  // Group by day key YYYY-MM-DD
  const byDay={};
  events.forEach(e=>{
    const d=new Date(e.date);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!byDay[key]) byDay[key]=[];
    byDay[key].push(e);
  });

  const grid=document.getElementById('calendar-grid');
  grid.innerHTML='';

  // Nav row
  const nav=document.createElement('div'); nav.className='cal-nav';
  nav.innerHTML=`<button class="cal-nav-btn" onclick="prevMonth()">‹</button>
    <span class="cal-month-title">${MONTHS[month].toUpperCase()} ${year}</span>
    <button class="cal-nav-btn" onclick="nextMonth()">›</button>`;
  grid.appendChild(nav);

  // Weekday headers
  const wdRow=document.createElement('div'); wdRow.className='cal-weekdays';
  ['Lu','Ma','Mi','Ju','Vi','Sá','Do'].forEach(d=>{
    const el=document.createElement('div'); el.className='cal-wd'; el.textContent=d;
    wdRow.appendChild(el);
  });
  grid.appendChild(wdRow);

  // Days grid
  const daysEl=document.createElement('div'); daysEl.className='cal-days';
  const firstDow=(new Date(year,month,1).getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();

  // Prev month fill
  for(let i=firstDow-1;i>=0;i--){
    const cell=makeDayCell(daysInPrev-i,true,[],false);
    daysEl.appendChild(cell);
  }
  // Current month
  for(let d=1;d<=daysInMonth;d++){
    const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvs=byDay[key]||[];
    const isToday=d===now.getDate()&&month===now.getMonth()&&year===now.getFullYear();
    daysEl.appendChild(makeDayCell(d,false,dayEvs,isToday));
  }
  // Next month fill
  const total=firstDow+daysInMonth;
  const rem=total%7===0?0:7-(total%7);
  for(let d=1;d<=rem;d++) daysEl.appendChild(makeDayCell(d,true,[],false));

  grid.appendChild(daysEl);
}

function renderNextEvent(ev){
  const wrap=document.getElementById('next-event-wrap');
  if(!ev){ wrap.innerHTML=''; return; }
  const d=new Date(ev.date);
  const timeStr=d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  const dateStr=d.toLocaleDateString('es-CL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();

  let playersHTML='';
  if(ev.type==='dm'){
    playersHTML=`<span class="next-event-dm-vs">VS</span>`;
  } else {
    const pa=pl(ev.player_a), pb=pl(ev.player_b);
    playersHTML=`
      <div class="next-event-player">${pa?`<img src="${pa.avatar}" onerror="this.style.background='#333'">`:''}
        <span>${pa?pa.name:'TBD'}</span></div>
      <span class="next-event-vs">VS</span>
      <div class="next-event-player">${pb?`<img src="${pb.avatar}" onerror="this.style.background='#333'">`:''}
        <span>${pb?pb.name:'TBD'}</span></div>`;
  }

  wrap.innerHTML=`<div class="next-event">
    <div class="next-event-top-row">
      <div>
        <div class="next-event-label">Próximo combate</div>
        <div class="next-event-round">${ev.round.toUpperCase()}</div>
      </div>
      <div class="next-event-players">${playersHTML}</div>
    </div>
    <div class="next-event-meta">${dateStr} · ${timeStr}</div>
  </div>`;
}

function makeDayCell(day,other,events,isToday){
  const cell=document.createElement('div');
  cell.className=`cal-day${other?' other-month':''}${isToday?' today':''}${events.length&&!other?' has-event':''}`;

  const num=document.createElement('span'); num.className='cal-day-num'; num.textContent=day;
  cell.appendChild(num);

  if(events.length&&!other){
    const ev=events[0];
    const timeStr=new Date(ev.date).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    const preview=document.createElement('div'); preview.className='cal-preview';

    if(ev.type==='dm'){
      preview.innerHTML=`<div class="cal-preview-dm">DEATHMATCH</div><div class="cal-time">${timeStr}</div>`;
    } else {
      const pa=pl(ev.player_a), pb=pl(ev.player_b);
      const avA=pa?`<img class="cal-avatar" src="${pa.avatar}" onerror="this.style.background='#333'">`:'<div class="cal-avatar-ph"></div>';
      const avB=pb?`<img class="cal-avatar" src="${pb.avatar}" onerror="this.style.background='#333'">`:'<div class="cal-avatar-ph"></div>';
      preview.innerHTML=`<div class="cal-preview-match">${avA}<span class="cal-vs">VS</span>${avB}</div><div class="cal-time">${timeStr}</div>`;
    }
    cell.appendChild(preview);

    const dots=document.createElement('div'); dots.className='cal-dots';
    events.slice(0,4).forEach(e=>{
      const dot=document.createElement('span');
      dot.className=`cal-dot ${e.type==='dm'?'dm-dot':'match-dot'}`;
      dots.appendChild(dot);
    });
    cell.appendChild(dots);
    cell.onclick=()=>showEventPopup(events);
  }
  return cell;
}

function showEventPopup(events){
  document.getElementById('cal-popup')?.remove();
  const overlay=document.createElement('div'); overlay.id='cal-popup'; overlay.className='cal-popup-overlay';
  overlay.onclick=e=>{ if(e.target===overlay) overlay.remove(); };

  const card=document.createElement('div'); card.className='cal-popup-card';
  const closeBtn=document.createElement('button'); closeBtn.className='cal-popup-close'; closeBtn.textContent='×';
  closeBtn.onclick=()=>overlay.remove(); card.appendChild(closeBtn);

  events.forEach(ev=>{
    const d=new Date(ev.date);
    const timeStr=d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    const dateStr=d.toLocaleDateString('es-CL',{weekday:'long',day:'2-digit',month:'long'}).toUpperCase();

    const block=document.createElement('div'); block.className='cal-popup-event';

    if(ev.type==='dm'){
      block.innerHTML=`
        <div class="cal-popup-round">${ev.round.toUpperCase()}</div>
        <div class="cal-popup-vs-dm">VS</div>
        <div class="cal-popup-time">${timeStr}</div>
        <div class="cal-popup-date">${dateStr}</div>`;
    } else {
      const pa=pl(ev.player_a), pb=pl(ev.player_b);
      const ava=pa?`<img src="${pa.avatar}" onerror="this.style.background='#333'">`:'<div class="cal-popup-avatar-ph"></div>';
      const avb=pb?`<img src="${pb.avatar}" onerror="this.style.background='#333'">`:'<div class="cal-popup-avatar-ph"></div>';
      block.innerHTML=`
        <div class="cal-popup-round">${ev.round.toUpperCase()}</div>
        <div class="cal-popup-players">
          <div class="cal-popup-player">${ava}<span>${pa?pa.name:'TBD'}</span></div>
          <div class="cal-popup-vs">VS</div>
          <div class="cal-popup-player">${avb}<span>${pb?pb.name:'TBD'}</span></div>
        </div>
        <div class="cal-popup-time">${timeStr}</div>
        <div class="cal-popup-date">${dateStr}</div>
        ${ev.finished?`<div class="cal-popup-result">${ev.score_a}–${ev.score_b} mapas</div><div class="cal-popup-finished">Finalizado</div>`:''}`;
    }
    card.appendChild(block);
  });

  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

// ── PARTICLES + EMBERS + LIGHTNING ──
function initParticles(){
  const canvas=document.getElementById('particles-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,pts; const embers=[],bolts=[];
  const EMBER_COLORS=['rgba(224,26,26,','rgba(255,70,10,','rgba(245,120,0,','rgba(255,160,20,'];
  let frame=0,nextBolt=120;
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
  function make(){ pts=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.3,a:Math.random()*.5+.1,red:Math.random()<.25})); }
  function spawnEmber(){ const col=EMBER_COLORS[Math.floor(Math.random()*EMBER_COLORS.length)]; embers.push({x:Math.random()*W,y:H+4,vx:(Math.random()-.5)*.8,vy:-(Math.random()*2.2+.6),r:Math.random()*1.8+.4,life:1,decay:Math.random()*.005+.003,col,flicker:Math.random()*Math.PI*2}); }
  function jag(x1,y1,x2,y2,rough,depth){ if(depth===0) return [{x:x1,y:y1},{x:x2,y:y2}]; const mx=(x1+x2)/2+(Math.random()-.5)*rough,my=(y1+y2)/2+(Math.random()-.5)*rough*.15; return [...jag(x1,y1,mx,my,rough/2,depth-1).slice(0,-1),...jag(mx,my,x2,y2,rough/2,depth-1)]; }
  function spawnBolt(){ const x=Math.random()*W,depth=H*(0.45+Math.random()*.5),pts2=jag(x,-10,x+(Math.random()-.5)*180,depth,160,8),branches=[]; for(let i=4;i<pts2.length-4;i+=Math.floor(Math.random()*6+3)){ if(Math.random()<.4){ const bLen=25+Math.random()*90,ang=(Math.random()-.5)*1.4,brPts=jag(pts2[i].x,pts2[i].y,pts2[i].x+Math.sin(ang)*bLen,pts2[i].y+Math.cos(ang)*bLen,50,5); branches.push({pts:brPts,start:i/pts2.length}); } } bolts.push({pts:pts2,branches,progress:0,speed:0.07+Math.random()*.05,phase:'travel',life:1,decay:Math.random()*.07+.055}); }
  function drawBolt(points,alpha,lw){ if(!points||points.length<2) return; ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y); for(const p of points) ctx.lineTo(p.x,p.y); ctx.strokeStyle=`rgba(200,0,0,${alpha*.22})`; ctx.lineWidth=lw*5; ctx.stroke(); ctx.strokeStyle=`rgba(230,30,30,${alpha*.5})`; ctx.lineWidth=lw*2; ctx.stroke(); ctx.strokeStyle=`rgba(255,160,160,${alpha*.95})`; ctx.lineWidth=lw*.6; ctx.stroke(); }
  function draw(){
    ctx.clearRect(0,0,W,H); frame++;
    pts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.red?`rgba(224,26,26,${p.a})`:`rgba(200,200,200,${p.a*.4})`; ctx.fill(); });
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){ const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy); if(dist<120){ const a=(1-dist/120)*.15; ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.strokeStyle=(pts[i].red||pts[j].red)?`rgba(224,26,26,${a})`:`rgba(255,255,255,${a*.4})`; ctx.lineWidth=.5; ctx.stroke(); } }
    if(Math.random()<.45) spawnEmber();
    for(let i=embers.length-1;i>=0;i--){ const e=embers[i]; e.flicker+=.09; e.x+=e.vx+Math.sin(e.flicker)*.18; e.y+=e.vy; e.vy*=.997; e.life-=e.decay; if(e.life<=0){embers.splice(i,1);continue;} const pulse=.7+Math.abs(Math.sin(e.flicker))*.3; ctx.beginPath(); ctx.arc(e.x,e.y,e.r*pulse,0,Math.PI*2); ctx.fillStyle=e.col+e.life+')'; ctx.fill(); const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*5); g.addColorStop(0,e.col+(e.life*.45)+')'); g.addColorStop(1,e.col+'0)'); ctx.beginPath(); ctx.arc(e.x,e.y,e.r*5,0,Math.PI*2); ctx.fillStyle=g; ctx.fill(); }
    if(frame>=nextBolt){ spawnBolt(); if(Math.random()<.35) setTimeout(spawnBolt,80+Math.random()*120); if(Math.random()<.15) setTimeout(spawnBolt,220+Math.random()*180); nextBolt=frame+Math.floor(Math.random()*480+360); }
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(let i=bolts.length-1;i>=0;i--){ const b=bolts[i]; if(b.phase==='travel'){ b.progress+=b.speed; if(b.progress>=1){b.progress=1;b.phase='fade';} const end=Math.max(2,Math.floor(b.pts.length*b.progress)); drawBolt(b.pts.slice(0,end),1,2); for(const br of b.branches){ if(b.progress>br.start){ const brProg=Math.min(1,(b.progress-br.start)/(1-br.start)); drawBolt(br.pts.slice(0,Math.max(2,Math.floor(br.pts.length*brProg))),.7,.9); } } } else { b.life-=b.decay; if(b.life<=0){bolts.splice(i,1);continue;} if(b.life>0.88){ctx.fillStyle=`rgba(180,0,0,${(b.life-.88)*0.07})`;ctx.fillRect(0,0,W,H);} drawBolt(b.pts,b.life,2); for(const br of b.branches) drawBolt(br.pts,b.life*.6,.9); } }
    ctx.lineCap='butt'; ctx.lineJoin='miter';
    requestAnimationFrame(draw);
  }
  resize(); make(); draw();
  window.addEventListener('resize',()=>{resize();make();});
}

function glitchReveal(el, finalText) {
  const gc = '!<>-_\\/[]{}=+*^?#@$%▓░█▌▐0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const lockAt = Array.from({length:finalText.length},(_,i)=>Math.floor(i*7)+3+Math.floor(Math.random()*5));
  let frame=0; const maxFrame=Math.max(...lockAt)+3;
  el.classList.add('glitching');
  const id=setInterval(()=>{
    el.textContent=finalText.split('').map((c,i)=>{
      if(c===' ') return ' ';
      if(frame>=lockAt[i]) return c;
      return gc[Math.floor(Math.random()*gc.length)];
    }).join('');
    frame++;
    if(frame>=maxFrame){
      clearInterval(id); el.textContent=finalText;
      el.classList.remove('glitching'); el.classList.add('glitch-settled');
      const cur=document.createElement('span'); cur.className='glitch-cursor'; cur.textContent='_';
      el.appendChild(cur);
    }
  },38);
}

document.getElementById('fy').textContent=new Date().getFullYear();
async function init(){
  initParticles();
  glitchReveal(document.getElementById('page-title'),'FECHAS');
  const data=await loadData();
  if(data) renderCalendar(data, new Date().getFullYear(), new Date().getMonth());
}
init();
